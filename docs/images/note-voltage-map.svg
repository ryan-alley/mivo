  <rect x="40" y="728" width="1200" height="143" rx="12" fill="#f3f6fa"/>
  <text x="60" y="759" class="label">V = 3.3 x (clamp(MIDI note, 60, 96) - 60) / 36</text>
  <text x="60" y="787" class="label">1 octave = 1.1 V | 1 semitone = 0.091667 V | 1 sound bin = 3.6 semitone steps (3 or 4 playable keys).</text>
  <text x="60" y="814" class="small muted">Example: encoder selects bank 0 (digits 0-9); Sound CV selects a digit, not a bank. Gate In triggers speech.</text>
  <text x="60" y="837" class="small muted">Bins include their lower boundary, exclude their upper boundary; the last includes 3.3 V. Verify actual switching points.</text>
  <text x="60" y="860" class="small muted">Equal-bin approximation, not published Talko firmware thresholds. This is control selection, not 1 V/oct pitch tuning.</text>
</svg>
