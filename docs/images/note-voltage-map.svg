<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">C3 to C6: linear voltage and an approximate ten-sound bank</title>
  <desc id="desc">A piano keyboard runs from C3, MIDI 60, at zero volts to C6, MIDI 96, at 3.3 volts. C4 is 1.1 volts; C5 is 2.2 volts. Ten equal example Sound CV bins are 0.33 volts wide. The approximate note ranges for sounds one to ten are C3 to D sharp 3, E3 to G3, G sharp 3 to A sharp 3, B3 to D4, D sharp 4 to F4, F sharp 4 to A4, A sharp 4 to C sharp 5, D5 to E5, F5 to G sharp 5, and A5 to C6. Bank zero contains spoken digits zero to nine. Thresholds are illustrative, not firmware specifications.</desc>
